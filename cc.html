    <!-- Sidebar for Blog Posts -->
    <main class="main">
        <div class="sidebar">
            <h3>Blog Posts</h3>
            <div class="blog-list" id="blogList"></div>
        </div>

        <!-- Main Content -->
        <div class="container">
            <h2>Manage Blog Posts</h2>
            <label>Title:</label>
            <input type="text" id="title">
            <label>Image URL:</label>
            <input type="text" id="imageUrl" placeholder="Enter image URL">
            <label>Description:</label>
            <textarea id="description"></textarea>
            <label>Category:</label>
            <select id="category">
                <option>Technology</option>
                <option>Business</option>
                <option>Health</option>
            </select>
            <div class="toolbar">
                <button onclick="addElement('img')">Image</button>
                <button onclick="addElement('video')">Video</button>
                <button onclick="addElement('code')">Code</button>
            </div>
            <textarea id="editor"></textarea>
            <script>
                CKEDITOR.replace('editor');
            </script>
            <button onclick="savePost()" id="saveButton">Save Post</button>
        </div>
    </main>

    <script>
        // Define Firebase and Firestore variables globally
        let db;
        let editingPostId = null;

        // Function to format text
        function formatText(command) {
            document.execCommand(command, false, null);
        }

        // Function to add elements (image, video, code)
        function addElement(type) {
            let editor = CKEDITOR.instances.editor;
            if (type === 'img') {
                let url = prompt('Enter image URL:');
                if (url) editor.insertHtml(`<img src="${url}" style="max-width:100%;">`);
            } else if (type === 'video') {
                let url = prompt('Enter YouTube embed link:');
                if (url) editor.insertHtml(`<iframe width="100%" height="200" src="${url}" frameborder="0"></iframe>`);
            } else if (type === 'code') {
                let code = prompt('Enter code:');
                if (code) editor.insertHtml(`<pre><code>${code}</code></pre>`);
            }
        }

        // Function to save or update a blog post
        async function savePost() {
            const title = document.getElementById('title').value;
            const imageUrl = document.getElementById('imageUrl').value;
            const description = document.getElementById('description').value;
            const category = document.getElementById('category').value;
            const content = CKEDITOR.instances.editor.getData();

            if (!title || !imageUrl || !description || !content) {
                alert('All fields are required!');
                return;
            }

            const post = { title, imageUrl, description, category, content };

            try {
                if (editingPostId) {
                    await db.collection('blogs').doc(editingPostId).update(post);
                    alert('Blog updated successfully!');
                } else {
                    const docRef = await db.collection('blogs').add(post);
                    console.log('Blog saved with ID:', docRef.id);
                    alert('Blog saved successfully!');
                }
                resetForm();
                loadPosts();
            } catch (error) {
                console.error('Error saving blog:', error);
                alert('Failed to save blog. Check console for details.');
            }
        }

        // Function to load blog posts
        async function loadPosts() {
            try {
                const snapshot = await db.collection('blogs').get();
                const blogList = document.getElementById('blogList');
                blogList.innerHTML = '';

                snapshot.forEach((doc) => {
                    const post = doc.data();
                    blogList.innerHTML += `
                        <div class="blog-item">
                            <h4>${post.title}</h4>
                            <img src="${post.imageUrl}" style="max-width:100%;">
                            <p><strong>Category:</strong> ${post.category}</p>
                            <p>${post.description}</p>
                            <button onclick="editPost('${doc.id}')">Edit</button>
                            <button onclick="deletePost('${doc.id}')">Delete</button>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Error loading blogs:', error);
            }
        }

        // Function to delete a blog post
        async function deletePost(id) {
            try {
                await db.collection('blogs').doc(id).delete();
                loadPosts();
            } catch (error) {
                console.error('Error deleting blog:', error);
            }
        }

        // Function to edit a blog post
        async function editPost(id) {
            try {
                const doc = await db.collection('blogs').doc(id).get();
                if (doc.exists) {
                    const post = doc.data();
                    document.getElementById('title').value = post.title;
                    document.getElementById('imageUrl').value = post.imageUrl;
                    document.getElementById('description').value = post.description;
                    document.getElementById('category').value = post.category;
                    CKEDITOR.instances.editor.setData(post.content);

                    editingPostId = id;
                    document.getElementById('saveButton').textContent = 'Update Post';
                }
            } catch (error) {
                console.error('Error editing blog:', error);
            }
        }

        // Function to reset the form
        function resetForm() {
            document.getElementById('title').value = '';
            document.getElementById('imageUrl').value = '';
            document.getElementById('description').value = '';
            document.getElementById('category').value = 'Technology';
            CKEDITOR.instances.editor.setData('');
            editingPostId = null;
            document.getElementById('saveButton').textContent = 'Save Post';
        }

        // Initialize Firebase when the DOM is fully loaded
        document.addEventListener('DOMContentLoaded', () => {
            // Your Firebase configuration
            const firebaseConfig = {
                apiKey: "AIzaSyBtxzo1ObhEb-gSG00qxeRBg9WHeuLk2rE",
                authDomain: "webpage-d2496.firebaseapp.com",
                projectId: "webpage-d2496",
                storageBucket: "webpage-d2496.firebasestorage.app",
                messagingSenderId: "921444545874",
                appId: "1:921444545874:web:c77134d28bb7294742b68b",
                measurementId: "G-0P5F4JSTHD"
            };

            // Initialize Firebase
            const app = firebase.initializeApp(firebaseConfig);
            db = firebase.firestore(app);  // Ensure Firestore is properly initialized

            // Debugging: Check Firebase initialization
            console.log('Firebase initialized:', app);
            console.log('Firestore instance:', db);

            // Load posts when the page loads
            loadPosts();
        });
    </script>
