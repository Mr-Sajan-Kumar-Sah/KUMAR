<!-- Add Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-firestore.js"></script>

<script>
    // Your Firebase configuration
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID",
    };

    // Initialize Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function loadBlog() {
        const urlParams = new URLSearchParams(window.location.search);
        const blogId = urlParams.get('id');

        if (!blogId) {
            document.getElementById('blogContent').innerHTML = '<p>Blog not found.</p>';
            return;
        }

        try {
            const doc = await db.collection('blogs').doc(blogId).get();
            if (doc.exists) {
                const blog = doc.data();
                document.getElementById('blogContent').innerHTML = `
                    <h1>${blog.title}</h1>
                    <img src="${blog.imageUrl}" alt="Blog Image" style="max-width:100%;">
                    <p>${blog.description}</p>
                    <div>${blog.content}</div>
                `;
            } else {
                document.getElementById('blogContent').innerHTML = '<p>Blog not found.</p>';
            }
        } catch (error) {
            console.error('Error loading blog:', error);
        }
    }

    window.onload = loadBlog;
</script>
