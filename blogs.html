<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mr.Sajan</title>
    <link rel="stylesheet" href="assets/swiper-bundle.min.css" />
    <link rel="stylesheet" href="assets/newcss.css" />
    <link
      rel="stylesheet"
      href="https://unicons.iconscout.com/release/v4.0.8/css/line.css"
    />

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        background-color: #f9f9f9;
      }

      .container {
        max-width: 1200px;
        margin: 20px auto;
        padding: 0 15px;
      }

      h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
      }

      #blogContainer {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
      }

      .blog-card {
        background: white;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        cursor: pointer;
      }

      .blog-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 6px 10px rgba(0, 0, 0, 0.2);
      }

      .blog-card img {
        width: 100%;
        height: 200px;
        object-fit: cover;
      }

      .blog-card h3 {
        margin: 15px;
        font-size: 1.5rem;
        color: #007bff;
      }

      .blog-card p {
        margin: 15px;
        font-size: 1rem;
        color: #555;
      }

      .modal {
        display: none; /* Initially hidden */
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
      }

      .modal-content {
        background: white;
        padding: 20px;
        width: 50%;
        border-radius: 10px;
        position: relative;
        text-align: center;
        max-height: 80vh; /* Fixed height */
        overflow-y: auto; /* Enables vertical scrolling */
      }

      .modal-content img {
        max-width: 100%;
        height: auto;
        margin-top: 10px;
      }

      .close-btn {
        position: absolute;
        top: 10px;
        right: 15px;
        font-size: 24px;
        cursor: pointer;
        font-weight: bold;
      }
    </style>
  </head>

  <body oncontextmenu="return false">
    <header class="header" id="header">
      <nav class="nav container">
        <a href="index.html" class="nav__logo">Mr.Sajan Sah</a>
        <div class="nav__menu" id="nav-menu">
          <ul class="nav__list grid">
            <li class="nav__item">
              <a href="index.html" class="nav__link active-link">
                <i class="uil uil-estate nav__icon"></i>Home
              </a>
            </li>
            <li class="nav__item">
              <a href="/pages/about.html" class="nav__link">
                <i class="uil uil-user nav__icon"></i>About
              </a>
            </li>
            <li class="nav__item">
              <a href="pages/certificates.html" class="nav__link">
                <i class="uil uil-briefcase-alt nav__icon"></i>Certificates
              </a>
            </li>
            <li class="nav__item">
              <a href="projects.html" class="nav__link">
                <i class="uil uil-scenery nav__icon"></i>Projects
              </a>
            </li>
            <li class="nav__item">
              <a href="pages/contact.html" class="nav__link">
                <i class="uil uil-message nav__icon"></i>Contact-Me
              </a>
            </li>
            <li class="nav__item">
              <a href="#" class="nav__link login-trigger">
                <i class="uil uil-message nav__icon"></i> Login
              </a>
            </li>
          </ul>
          <i class="uil uil-times nav__close" id="nav-close"></i>
        </div>
      </nav>
    </header>

    <main class="main">
      <div class="container">
        <h2>Blogs</h2>
        <div id="blogContainer"></div>
      </div>
    </main>

    <!-- Floating Modal for Blog View -->
    <div id="blogModal" class="modal">
      <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2 id="modalTitle"></h2>
        <img id="modalImage" src="" alt="Blog Image" />
        <p id="modalDescription"></p>
        <div id="modalContent"></div>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js";
      import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBtxzo1ObhEb-gSG00qxeRBg9WHeuLk2rE",
        authDomain: "webpage-d2496.firebaseapp.com",
        projectId: "webpage-d2496",
        storageBucket: "webpage-d2496.firebasestorage.app",
        messagingSenderId: "921444545874",
        appId: "1:921444545874:web:c77134d28bb7294742b68b",
        measurementId: "G-0P5F4JSTHD",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      async function loadBlogs() {
        try {
          const blogContainer = document.getElementById("blogContainer");
          blogContainer.innerHTML = "";

          const querySnapshot = await getDocs(collection(db, "blogs"));
          querySnapshot.forEach((doc) => {
            const post = doc.data();
            const blogCard = document.createElement("div");
            blogCard.className = "blog-card";
            blogCard.innerHTML = `
              <h3>${post.title}</h3>
              <img src="${post.imageUrl}" alt="Blog Image" />
              <p>${post.description.substring(0, 100)}...</p>
            `;

            blogCard.onclick = () => {
              document.getElementById("modalTitle").innerText = post.title;
              document.getElementById("modalImage").src = post.imageUrl;
              document.getElementById("modalDescription").innerText = post.description;
              document.getElementById("modalContent").innerHTML = post.content || "";
              document.getElementById("blogModal").style.display = "flex";
            };

            blogContainer.appendChild(blogCard);
          });

          document.querySelector(".close-btn").onclick = () => {
            document.getElementById("blogModal").style.display = "none";
          };

          window.onclick = (event) => {
            const modal = document.getElementById("blogModal");
            if (event.target === modal) {
              modal.style.display = "none";
            }
          };
        } catch (error) {
          console.error("Error loading blogs:", error);
        }
      }

      document.addEventListener("DOMContentLoaded", loadBlogs);
    </script>
  </body>
</html>
