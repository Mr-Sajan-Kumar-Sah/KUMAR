      .blog-card img { max-width: 100%; height: auto; }

  <body oncontextmenu="return false">
    <header class="header" id="header">
      <nav class="nav container">
        <a href="index.html" class="nav__logo">Mr.Sajan Sah</a>
        <div class="nav__menu" id="nav-menu">
          <ul class="nav__list grid">
            <li class="nav__item">
              <a href="index.html" class="nav__link active-link">
                <i class="uil uil-estate nav__icon"></i>Home
              </a>
            </li>
            <li class="nav__item">
              <a href="/pages/about.html" class="nav__link">
                <i class="uil uil-user nav__icon"></i>About
              </a>
            </li>
            <li class="nav__item">
              <a href="pages/certificates.html" class="nav__link">
                <i class="uil uil-briefcase-alt nav__icon"></i>Certificates
              </a>
            </li>
            <li class="nav__item">
              <a href="projects.html" class="nav__link">
                <i class="uil uil-scenery nav__icon"></i>Projects
              </a>
            </li>
            <li class="nav__item">
              <a href="pages/contact.html" class="nav__link">

        </div>

          <!-- Theme change button -->
          <i class="uil uil-moon change-theme" id="theme-button"></i>

          <div class="nav__toggle" id="nav-toggle">
            <i class="uil uil-apps"></i>
          </div>
        </div>
      </nav>
    </header>
    <!-- main-->

    <main class="main">
      <div class="container">
        <h2>Blogs</h2>
        <div id="blogContainer"></div>
      </div>
    </main>

    <!--================== Footer ===============-->
    <div class="footer-bottom pt-5 pb-5" style="background-color: #222; color: white; text-align: center;">
      <div class="container">
          <div class="row justify-content-center">
              <div class="col-12">
                  <div class="footer-bottom__copyright" style="font-size: 16px; font-weight: 500;">
                      &copy; 2025 <a href="https://sajankumar.com.np" style="color: #fff; text-decoration: none; font-weight: bold;">sajankumar.com.np</a>
                  </div>
              </div>
          </div>
      </div>
    </div>
  
    <script>
      function loadBlogs() {
          let posts = JSON.parse(localStorage.getItem('posts')) || [];
          let blogContainer = document.getElementById('blogContainer');
          blogContainer.innerHTML = '';
          
          posts.forEach((post, index) => {
              let blogCard = document.createElement('div');
              blogCard.className = 'blog-card';
              blogCard.innerHTML = `
                  <h3>${post.title}</h3>
                  <img src="${post.imageUrl}" alt="Blog Image">
                  <p>${post.description}</p>
              `;
              blogCard.onclick = function() {
                  localStorage.setItem('selectedPost', JSON.stringify(post));
                  window.location.href = 'blog_view.html';
              };
              blogContainer.appendChild(blogCard);
          });
      }
      
      window.onload = loadBlogs;
    </script>

    <script type="text/javascript" src="assets/swiper-bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/2205d59d52.js" crossorigin="anonymous"></script>
    <script src="assets/ptj.js"></script>
  </body>
