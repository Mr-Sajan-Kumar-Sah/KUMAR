<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs | Mr.Sajan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Blog-specific styles */
        .blog-hero {
            position: relative;
            padding: var(--space-xxl) 0;
            text-align: center;
            overflow: hidden;
        }
        
        .blog-hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.1), rgba(255, 0, 228, 0.1));
            z-index: -1;
        }
        
        .blog-hero h1 {
            font-size: var(--text-xxxl);
            margin-bottom: var(--space-sm);
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .blog-hero p {
            max-width: 700px;
            margin: 0 auto var(--space-xl);
            font-size: var(--text-md);
            color: var(--text);
        }
        
        .blog-categories {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: var(--space-sm);
            margin-bottom: var(--space-xl);
        }
        
        .category-chip {
            padding: var(--space-xs) var(--space-md);
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--border-radius-xl);
            color: var(--text-dark);
            font-family: var(--font-heading);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: var(--text-xs);
            cursor: pointer;
            transition: all var(--transition-speed) var(--transition-easing);
        }
        
        .category-chip.active, .category-chip:hover {
            background-color: var(--primary);
            color: var(--bg-dark);
            border-color: var(--primary);
            box-shadow: var(--shadow-primary);
        }
        
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: var(--space-lg);
            margin-bottom: var(--space-xxl);
        }
        
        .blog-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--border-radius-lg);
            overflow: hidden;
            transition: all var(--transition-speed) var(--transition-easing);
            position: relative;
        }
        
        .blog-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary);
        }
        
        .blog-image {
            height: 200px;
            position: relative;
            overflow: hidden;
            background-size: cover;
            background-position: center;
        }
        
        .blog-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            opacity: 0;
            transition: opacity var(--transition-speed) var(--transition-easing);
            z-index: 1;
        }
        
        .blog-card:hover .blog-image::before {
            opacity: 0.2;
        }
        
        .blog-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
            z-index: 1;
        }
        
        .blog-category {
            position: absolute;
            top: var(--space-md);
            right: var(--space-md);
            background-color: var(--primary);
            color: var(--bg-dark);
            padding: var(--space-xxs) var(--space-sm);
            border-radius: var(--border-radius-xl);
            font-size: var(--text-xs);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 2;
        }
        
        .blog-content {
            padding: var(--space-lg);
        }
        
        .blog-date {
            font-size: var(--text-xs);
            color: var(--text-dark);
            margin-bottom: var(--space-xs);
            display: flex;
            align-items: center;
            gap: var(--space-xs);
        }
        
        .blog-date i {
            color: var(--primary);
        }
        
        .blog-title {
            font-size: var(--text-lg);
            margin-bottom: var(--space-sm);
            color: var(--text-light);
        }
        
        .blog-excerpt {
            font-size: var(--text-sm);
            color: var(--text);
            margin-bottom: var(--space-md);
            min-height: 60px;
        }
        
        .blog-tags {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-xs);
            margin-bottom: var(--space-md);
        }
        
        .blog-tag {
            background-color: rgba(0, 240, 255, 0.1);
            color: var(--primary);
            padding: var(--space-xxs) var(--space-sm);
            border-radius: var(--border-radius-xl);
            font-size: var(--text-xs);
            font-weight: 500;
        }
        
        .blog-link {
            display: inline-flex;
            align-items: center;
            color: var(--primary);
            font-size: var(--text-sm);
            transition: all var(--transition-speed) var(--transition-easing);
        }
        
        .blog-link i {
            margin-left: var(--space-xs);
            transition: transform var(--transition-speed) var(--transition-easing);
        }
        
        .blog-link:hover {
            color: var(--primary-light);
        }
        
        .blog-link:hover i {
            transform: translateX(3px);
        }
        
        .load-more {
            text-align: center;
            margin-bottom: var(--space-xxl);
        }
        
        /* Featured post styles */
        .featured-post {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-lg);
            margin-bottom: var(--space-xl);
        }
        
        .featured-post .blog-image {
            height: 100%;
            min-height: 300px;
        }
        
        .featured-post .blog-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .featured-post .blog-title {
            font-size: var(--text-xl);
        }
        
        .featured-post .blog-excerpt {
            font-size: var(--text-md);
        }
        
        @media (max-width: 768px) {
            .blog-grid {
                grid-template-columns: 1fr;
            }
            
            .blog-hero h1 {
                font-size: var(--text-xxl);
            }
            
            .featured-post {
                grid-template-columns: 1fr;
            }
            
            .featured-post .blog-image {
                min-height: 200px;
            }
        }
    </style>
</head>
<body>
    <!-- Particle Background Canvas -->
    <canvas id="particleCanvas"></canvas>
    
    <!-- Floating Navigation -->
    <nav class="floating-nav">
        <div class="nav-brand">
            <span class="nav-logo">SK</span>
            <span class="nav-name">Mr.Sajan</span>
        </div>
        <div class="nav-links">
            <a href="index.html#home" class="nav-link">
                <span class="link-icon"><i class="fas fa-home"></i></span>
                <span class="link-text">Home</span>
            </a>
            <a href="index.html#projects" class="nav-link">
                <span class="link-icon"><i class="fas fa-rocket"></i></span>
                <span class="link-text">Projects</span>
            </a>
            <a href="blogs.html" class="nav-link active">
                <span class="link-icon"><i class="fas fa-blog"></i></span>
                <span class="link-text">Blogs</span>
            </a>
            <a href="index.html#contact" class="nav-link">
                <span class="link-icon"><i class="fas fa-satellite-dish"></i></span>
                <span class="link-text">Contact</span>
            </a>
        </div>
        <div class="nav-footer">
            <button class="theme-toggle" aria-label="Toggle theme">
                <i class="fas fa-moon"></i>
                <i class="fas fa-sun"></i>
            </button>
            <div class="social-links">
                <a href="#" class="social-link" aria-label="GitHub"><i class="fab fa-github"></i></a>
                <a href="#" class="social-link" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
                <a href="#" class="social-link" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                <a href="#" class="social-link" aria-label="Medium"><i class="fab fa-medium"></i></a>
                <a href="admin-login.html" class="admin-link">
                    <i class="fas fa-lock"></i>
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="content-wrapper">
        <!-- Blog Hero Section -->
        <section class="blog-hero">
            <div class="container">
                <h1>AI/ML Insights</h1>
                <p>Exploring the frontiers of artificial intelligence and machine learning through in-depth articles, tutorials, and research summaries.</p>
                
                <div class="blog-categories">
                    <div class="category-chip active" data-category="all">All</div>
                    <div class="category-chip" data-category="research">Research</div>
                    <div class="category-chip" data-category="tutorials">Tutorials</div>
                    <div class="category-chip" data-category="quantum">Quantum AI</div>
                    <div class="category-chip" data-category="applications">Applications</div>
                </div>
            </div>
        </section>
        
        <!-- Blog Grid -->
        <section class="container">
            <div class="blog-grid" id="blogsContainer">
                <!-- Blogs will be loaded dynamically here -->
            </div>
            
            <div class="load-more">
                <button class="btn btn-outline" id="loadMoreBlogs">
                    <i class="fas fa-sync-alt"></i>
                    <span>Load More Articles</span>
                </button>
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="scripts.js"></script>
    <!-- Add Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
    
    <script>
        // Firebase configuration
        const firebaseConfig = {
    apiKey: "AIzaSyCWMMjn8zoqd9FBSLe8GU0kxzuvPtgd26o",
    authDomain: "sajankumar-7fe56.firebaseapp.com",
    projectId: "sajankumar-7fe56",
    storageBucket: "sajankumar-7fe56.firebasestorage.app",
    messagingSenderId: "530497965075",
    appId: "1:530497965075:web:a29f682c663c1d13b283e6",
    measurementId: "G-4HDJ9D9R32"
  };
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Load blogs from Firebase
        document.addEventListener('DOMContentLoaded', function() {
            loadBlogs();
            
            // Blog filtering functionality
            const categoryChips = document.querySelectorAll('.category-chip');
            
            categoryChips.forEach(chip => {
                chip.addEventListener('click', function() {
                    categoryChips.forEach(c => c.classList.remove('active'));
                    this.classList.add('active');
                    const category = this.getAttribute('data-category');
                    filterBlogs(category);
                });
            });
            
            // Load more blogs
            document.getElementById('loadMoreBlogs').addEventListener('click', function() {
                this.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Loading...</span>';
                setTimeout(() => {
                    this.innerHTML = '<i class="fas fa-sync-alt"></i><span>No More Articles</span>';
                    this.disabled = true;
                }, 1500);
            });
        });
        
        function loadBlogs() {
            const blogsContainer = document.getElementById('blogsContainer');
            blogsContainer.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i></div>';
            
            database.ref('blogs').once('value').then((snapshot) => {
                const blogsData = snapshot.val() || {};
                const blogs = Object.values(blogsData);
                
                if (blogs.length === 0) {
                    blogsContainer.innerHTML = '<p class="no-blogs">No blogs found. Check back later!</p>';
                    return;
                }
                
                // Sort by date (newest first)
                blogs.sort((a, b) => new Date(b.publishDate) - new Date(a.publishDate));
                
                blogsContainer.innerHTML = '';
                
                blogs.forEach((blog, index) => {
                    const categoryMap = {
                        'research': 'Research',
                        'tutorials': 'Tutorial',
                        'quantum': 'Quantum AI',
                        'applications': 'Application'
                    };
                    
                    const blogCard = document.createElement('article');
                    blogCard.className = index === 0 ? 'blog-card featured-post' : 'blog-card';
                    blogCard.setAttribute('data-category', blog.category);
                    
                    blogCard.innerHTML = `
                        <div class="blog-image" style="background-image: url('${blog.image}')">
                            <div class="blog-overlay"></div>
                            <div class="blog-category">${categoryMap[blog.category] || blog.category}</div>
                        </div>
                        <div class="blog-content">
                            <div class="blog-date">
                                <i class="far fa-calendar-alt"></i>
                                <span>${formatDate(blog.publishDate)}</span>
                            </div>
                            <h2 class="blog-title">${blog.title}</h2>
                            <p class="blog-excerpt">${blog.excerpt}</p>
                            <div class="blog-tags">
                                ${blog.tags.map(tag => `<span class="blog-tag">${tag}</span>`).join('')}
                            </div>
                            <a href="blog-post.html?id=${blog.id}" class="blog-link">
                                <span>Read Article</span>
                                <i class="fas fa-arrow-right"></i>
                            </a>
                        </div>
                    `;
                    
                    blogsContainer.appendChild(blogCard);
                });
            }).catch(error => {
                console.error("Error loading blogs:", error);
                blogsContainer.innerHTML = '<p class="error-message">Failed to load blogs. Please try again later.</p>';
            });
        }
        
        function filterBlogs(category) {
            const blogCards = document.querySelectorAll('.blog-card');
            
            blogCards.forEach(card => {
                const cardCategory = card.getAttribute('data-category');
                
                if (category === 'all' || cardCategory === category) {
                    card.style.display = 'block';
                    setTimeout(() => {
                        card.style.opacity = '1';
                        card.style.transform = 'translateY(0)';
                    }, 10);
                } else {
                    card.style.opacity = '0';
                    card.style.transform = 'translateY(20px)';
                    setTimeout(() => {
                        card.style.display = 'none';
                    }, 300);
                }
            });
        }
        
        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('en-US', options);
        }
    </script>
</body>
</html>
