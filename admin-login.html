<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Mr.Sajan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <!-- Particle Background Canvas -->
    <canvas id="particleCanvas"></canvas>
    
    <!-- Login Container -->
    <div class="admin-login-container">
        <div class="admin-login-card">
            <div class="admin-login-header">
                <div class="admin-logo">
                    <span>SK</span>
                </div>
                <h2>Admin Portal</h2>
                <p>Sorry, Only Mr.Sajan Sah Can Access</p>
            </div>
            
            <div class="admin-login-body">
                <div id="g_id_onload"
                    data-client_id="2403329490-ft9dsjqnopr2h2dtvtc2qrtgtopr7hkc.apps.googleusercontent.com"
                    data-context="signin"
                    data-ux_mode="popup"
                    data-callback="handleGoogleSignIn"
                    data-auto_prompt="false">
                </div>

                <div class="g_id_signin"
                    data-type="standard"
                    data-shape="pill"
                    data-theme="filled_blue"
                    data-text="signin_with"
                    data-size="large"
                    data-logo_alignment="left"
                    data-width="300">
                </div>
                
                <div class="admin-login-error" id="loginError"></div>
            </div>
            
            <div class="admin-login-footer">
                <p>System protected by www.sajankumar.com.np</p>
            </div>
        </div>
    </div>

    <script>
        // Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCWMMjn8zoqd9FBSLe8GU0kxzuvPtgd26o",
            authDomain: "sajankumar-7fe56.firebaseapp.com",
            projectId: "sajankumar-7fe56",
            storageBucket: "sajankumar-7fe56.appspot.com",
            messagingSenderId: "530497965075",
            appId: "1:530497965075:web:a29f682c663c1d13b283e6",
            measurementId: "G-4HDJ9D9R32"
        };
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        
        // Check if user is already logged in
        firebase.auth().onAuthStateChanged((user) => {
            if (user && user.email === 'sajansah205@gmail.com') {
                window.location.href = 'admin-dashboard.html';
            }
        });
        
        function handleGoogleSignIn(response) {
            const ADMIN_EMAIL = 'sajansah205@gmail.com';
            
            verifyGoogleToken(response.credential)
                .then(data => {
                    if (data.email === ADMIN_EMAIL) {
                        const credential = firebase.auth.GoogleAuthProvider.credential(response.credential);
                        return firebase.auth().signInWithCredential(credential);
                    } else {
                        throw new Error('You are not authorized to access this portal.');
                    }
                })
                .then(() => {
                    window.location.href = 'admin-dashboard.html';
                })
                .catch(error => {
                    console.error('Authentication error:', error);
                    document.getElementById('loginError').textContent = 
                        error.message || 'Authentication failed. Please try again.';
                    document.getElementById('loginError').style.display = 'block';
                    google.accounts.id.disableAutoSelect();
                });
        }
        
        async function verifyGoogleToken(token) {
            const payload = JSON.parse(atob(token.split('.')[1]));
            return {
                email: payload.email,
                name: payload.name,
                token: token
            };
        }
        </script>

    <script src="scripts.js"></script>
    <script src="admin-auth.js"></script>
</body>
</html>
