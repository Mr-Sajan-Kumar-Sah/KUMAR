<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr.Sajan</title>
    <link rel="stylesheet" href="assets/swiper-bundle.min.css" />
    <link rel="stylesheet" href="assets/newcss.css" />
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css" />
    <style>
        body { font-family: Arial, sans-serif; margin: 0; display: flex; }
        .sidebar { 
            width: 300px; 
            height: 100vh; 
            overflow-y: auto; 
            background-color: #f4f4f4; 
            padding: 20px; 
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1); 
            position: fixed; 
            left: 0; 
            top: 0; 
        }
        .container { 
            flex: 1; 
            margin-left: 320px; 
            padding: 20px; 
            max-width: 800px; 
        }
        textarea, input, select { width: 100%; padding: 10px; margin-top: 5px; }
        .toolbar button { margin: 5px; padding: 8px; cursor: pointer; }
        .blog-list { margin-top: 20px; }
        .blog-item { border: 1px solid #ddd; padding: 10px; margin: 5px 0; background-color: #fff; }
        .blog-item img { max-width: 100%; height: auto; }
    </style>
    <script src="https://cdn.ckeditor.com/4.21.0/full/ckeditor.js"></script>
</head>
<body>
    <!-- Sidebar for Blog Posts -->
    <div class="sidebar">
        <h3>Blog Posts</h3>
        <div class="blog-list" id="blogList"></div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <h2>Manage Blog Posts</h2>
        <label>Title:</label>
        <input type="text" id="title">
        <label>Image URL:</label>
        <input type="text" id="imageUrl" placeholder="Enter image URL">
        <label>Description:</label>
        <textarea id="description"></textarea>
        <label>Category:</label>
        <select id="category">
            <option>Technology</option>
            <option>Business</option>
            <option>Health</option>
        </select>
        <div class="toolbar">
            <button onclick="formatText('bold')">Bold</button>
            <button onclick="formatText('italic')">Italic</button>
            <button onclick="formatText('underline')">Underline</button>
            <button onclick="addElement('img')">Image</button>
            <button onclick="addElement('video')">Video</button>
            <button onclick="addElement('code')">Code</button>
        </div>
        <textarea id="editor"></textarea>
        <script>
            CKEDITOR.replace('editor');
        </script>
        <button onclick="savePost()">Save Post</button>
    </div>

    <script>
        // Define Firebase and Firestore variables globally
        let db;

        // Function to format text
        function formatText(command) {
            document.execCommand(command, false, null);
        }

        // Function to add elements (image, video, code)
        function addElement(type) {
            let editor = document.getElementById('editor');
            if (type === 'img') {
                let url = prompt('Enter image URL:');
                if (url) editor.innerHTML += `<img src="${url}" style="max-width:100%;">`;
            } else if (type === 'video') {
                let url = prompt('Enter YouTube embed link:');
                if (url) editor.innerHTML += `<iframe width="100%" height="200" src="${url}" frameborder="0"></iframe>`;
            } else if (type === 'code') {
                let code = prompt('Enter code:');
                if (code) editor.innerHTML += `<pre><code>${code}</code></pre>`;
            }
        }

        // Function to save a blog post
        async function savePost() {
            const title = document.getElementById('title').value;
            const imageUrl = document.getElementById('imageUrl').value;
            const description = document.getElementById('description').value;
            const category = document.getElementById('category').value;
            const content = document.getElementById('editor').innerHTML;

            if (!title || !imageUrl || !description || !editor) {
                alert('All fields are required!');
                return;
            }

            const post = { title, imageUrl, description, category, content };

            console.log('Saving post:', post); // Debugging

            try {
                const docRef = await db.collection('blogs').add(post);
                console.log('Blog saved with ID:', docRef.id); // Debugging
                alert('Blog saved successfully!');
                loadPosts();
            } catch (error) {
                console.error('Error saving blog:', error);
                alert('Failed to save blog. Check console for details.');
            }
        }

        // Function to load blog posts
        async function loadPosts() {
            try {
                const snapshot = await db.collection('blogs').get();
                const blogList = document.getElementById('blogList');
                blogList.innerHTML = '';

                snapshot.forEach((doc) => {
                    const post = doc.data();
                    blogList.innerHTML += `
                        <div class="blog-item">
                            <h4>${post.title}</h4>
                            <img src="${post.imageUrl}" style="max-width:100%;">
                            <p><strong>Category:</strong> ${post.category}</p>
                            <p>${post.description}</p>
                            <button onclick="deletePost('${doc.id}')">Delete</button>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Error loading blogs:', error);
            }
        }

        // Function to delete a blog post
        async function deletePost(id) {
            try {
                await db.collection('blogs').doc(id).delete();
                loadPosts();
            } catch (error) {
                console.error('Error deleting blog:', error);
            }
        }

        // Initialize Firebase when the DOM is fully loaded
        document.addEventListener('DOMContentLoaded', () => {
            // Your Firebase configuration
            const firebaseConfig = {
                apiKey: "AIzaSyBtxzo1ObhEb-gSG00qxeRBg9WHeuLk2rE",
                authDomain: "webpage-d2496.firebaseapp.com",
                projectId: "webpage-d2496",
                storageBucket: "webpage-d2496.firebasestorage.app",
                messagingSenderId: "921444545874",
                appId: "1:921444545874:web:c77134d28bb7294742b68b",
                measurementId: "G-0P5F4JSTHD"
            };

            // Initialize Firebase
            const app = firebase.initializeApp(firebaseConfig);
            db = firebase.firestore(app);  // Ensure Firestore is properly initialized

            // Debugging: Check Firebase initialization
            console.log('Firebase initialized:', app);
            console.log('Firestore instance:', db);

            // Load posts when the page loads
            loadPosts();
        });
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-firestore-compat.js"></script>
</body>
</html>
