<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mr.Sajan</title>
  <link rel="stylesheet" href="assets/swiper-bundle.min.css" />
  <link rel="stylesheet" href="assets/newcss.css" />
  <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css" />

  <style>
    .sidebar {
      width: 300px;
      height: calc(100vh - 60px);
      /* Adjust height to account for header */
      overflow-y: auto;
      background-color: #22cd16;
      padding: 20px;
      box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
      position: fixed;
      left: 0;
      top: 60px;
      /* Adjust top to account for header */
    }

    .container {
      flex: 1;
      margin-left: 320px;
      padding: 0px;
      max-width: 800px;
      margin-top: 0px;
      /* Adjust margin-top to account for header */
    }

    textarea,
    input,
    select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
    }

    .toolbar button {
      margin: 5px;
      padding: 8px;
      cursor: pointer;
    }

    .blog-list {
      margin-top: 20px;
    }

    .blog-item {
      border: 1px solid #ddd;
      padding: 10px;
      margin: 5px 0;
      background-color: #fff;
    }

    .blog-item img {
      max-width: 100%;
      height: auto;
    }

    .blog-item button {
      margin-right: 5px;
    }

    .code-block {
      background-color: #f4f4f4;
      padding: 10px;
      border: 1px solid #ddd;
      position: relative;
      font-family: monospace;
      border-radius: 5px;
      margin: 10px 0;
    }

    .code-block pre {
      margin: 0;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .copy-button {
      position: absolute;
      top: 5px;
      right: 5px;
      background-color: #007bff;
      color: white;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 3px;
    }

    .copy-button:hover {
      background-color: #0056b3;
    }

    /* Mobile Responsiveness */
    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        height: auto;
        position: static;
        margin-bottom: 20px;
      }

      /* Preview Modal */
      .preview-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.8);
        z-index: 1000;
        overflow-y: auto;
        padding: 20px;
      }

      .blog-item button.preview {
        background-color: #17a2b8;
        color: white;
      }

      .preview-content {
        background-color: white;
        padding: 20px;
        border-radius: 10px;
        max-width: 800px;
        margin: 0 auto;
      }

      .preview-content img {
        max-width: 100%;
        height: auto;
      }

      .close-preview {
        float: right;
        cursor: pointer;
        font-size: 24px;
      }
  </style>
  <script src="https://cdn.ckeditor.com/4.21.0/full/ckeditor.js"></script>
</head>

<body oncontextmenu="return false">
  <header class="header" id="header">
    <nav class="nav container">
      <a href="index.html" class="nav__logo">Mr.Sajan Sah</a>
      <div class="nav__menu" id="nav-menu">
        <ul class="nav__list grid">
          <li class="nav__item">
            <a href="index.html" class="nav__link active-link">
              <i class="uil uil-estate nav__icon"></i>Home
            </a>
          </li>
          <li class="nav__item">
            <a href="/pages/about.html" class="nav__link">
              <i class="uil uil-user nav__icon"></i>About
            </a>
          </li>

          <li class="nav__item">
            <a href="pages/certificates.html" class="nav__link">
              <i class="uil uil-briefcase-alt nav__icon"></i>Certificates
            </a>
          </li>
          <li class="nav__item">
            <a href="projects.html" class="nav__link">
              <i class="uil uil-scenery nav__icon"></i>Projects
            </a>
          </li>
          <li class="nav__item">
            <a href="pages/contact.html" class="nav__link">
              <i class="uil uil-message nav__icon"></i>Contact-Me
            </a>
          </li>
          <li class="nav__item">
            <a href="blogs.html" class="nav__link">
              <i class="uil uil-message nav__icon"></i>Blogs
            </a>
          </li>
          <li class="nav__item">
            <a href="#" class="nav__link login-trigger" id="logoutButton">
              <i class="uil uil-message nav__icon"></i> Logout
            </a>
          </li>
        </ul>
        <i class="uil uil-times nav__close" id="nav-close"></i>
      </div>
      <div class="nav__btns">
        <!-- Theme change button -->
        <i class="uil uil-moon change-theme" id="theme-button"></i>

        <div class="nav__toggle" id="nav-toggle">
          <i class="uil uil-apps"></i>
        </div>
      </div>
    </nav>
  </header>
  <!-- main-->

  <main class="main">

    <section class="home section" id="home">
      <div class="sidebar">
        <h3>Blog Posts</h3>
        <div class="blog-list" id="blogList"></div>
      </div>

      <!-- Main Content -->
      <div class="container">
        <h2>Manage Blog Posts</h2>
        <label>Title:</label>
        <input type="text" id="title">
        <label>Image URL:</label>
        <input type="text" id="imageUrl" placeholder="Enter image URL">
        <label>Description:</label>
        <textarea id="description"></textarea>
        <label>Category:</label>
        <select id="category">
          <option>Technology</option>
          <option>Business</option>
          <option>Health</option>
        </select>
        <div class="toolbar">
          <button onclick="insertImage()">Image</button>
          <button onclick="insertVideo()">Video</button>
          <button onclick="insertCodeBlock()">Code</button>
          <button onclick="previewPost()">Preview</button>
        </div>
        <textarea id="editor"></textarea>
        <script>
          CKEDITOR.replace('editor');
        </script>
        <button onclick="savePost()" id="saveButton">Save Post</button>
      </div>
    </section>

    <div id="previewModal" class="preview-modal">
      <div class="preview-content">
        <span class="close-preview" onclick="closePreview()">&times;</span>
        <h2 id="previewTitle"></h2>
        <img id="previewImage" src="" alt="Preview Image" style="max-width: 100%; height: auto;" />
        <p id="previewDescription"></p>
        <div id="previewContent"></div>
      </div>
    </div>
  </main>

  <script>
    // Define Firebase and Firestore variables globally
    let db;
    let editingPostId = null;

    function insertImage() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const imageUrl = event.target.result;
            CKEDITOR.instances.editor.insertHtml(`<img src="${imageUrl}" style="max-width:100%;">`);
          };
          reader.readAsDataURL(file);
        }
      };
      input.click();
    }

    async function viewPost(id) {
      try {
        const doc = await db.collection('blogs').doc(id).get();
        if (doc.exists) {
          const post = doc.data();
          document.getElementById('previewTitle').innerText = post.title;
          document.getElementById('previewImage').src = post.imageUrl;
          document.getElementById('previewDescription').innerText = post.description;
          document.getElementById('previewContent').innerHTML = post.content;

          // Track view count
          await db.collection('blogs').doc(id).update({
            views: post.views + 1,
          });

          document.getElementById('previewModal').style.display = 'block';
        }
      } catch (error) {
        console.error('Error viewing blog:', error);
      }
    }

    // Function to insert a video
    function insertVideo() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'video/*';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const videoUrl = event.target.result;
            CKEDITOR.instances.editor.insertHtml(`<video controls src="${videoUrl}" style="max-width:100%;"></video>`);
          };
          reader.readAsDataURL(file);
        }
      };
      input.click();
    }

    // Function to insert a code block
    function insertCodeBlock() {
      const codeBlock = `
                <div class="code-block">
                    <pre><code contenteditable="true">// Write your code here</code></pre>
                    <button class="copy-button" onclick="copyCode(this)">Copy</button>
                </div>
            `;
      CKEDITOR.instances.editor.insertHtml(codeBlock);
    }

    // Function to copy code
    function copyCode(button) {
      const codeBlock = button.previousElementSibling;
      const codeText = codeBlock.textContent;
      navigator.clipboard.writeText(codeText).then(() => {
        alert('Code copied to clipboard!');
      }).catch(() => {
        alert('Failed to copy code.');
      });
    }

    function previewPost() {
      const title = document.getElementById('title').value;
      const imageUrl = document.getElementById('imageUrl').value;
      const description = document.getElementById('description').value;
      const content = CKEDITOR.instances.editor.getData();

      // Populate preview modal content
      document.getElementById('previewTitle').innerText = title;
      document.getElementById('previewImage').src = imageUrl;
      document.getElementById('previewDescription').innerText = description;
      document.getElementById('previewContent').innerHTML = content;

      // Display the preview modal
      document.getElementById('previewModal').style.display = 'block';
    }

    // Close preview modal
    function closePreview() {
      document.getElementById('previewModal').style.display = 'none';
    }

    // Logout functionality
    document.getElementById('logoutButton').addEventListener('click', (e) => {
      e.preventDefault();
      const confirmLogout = confirm('Are you sure you want to logout?');
      if (confirmLogout) {
        window.location.href = 'index.html';
      }
    });

    // Function to save or update a blog post
    async function savePost() {
      const title = document.getElementById('title').value;
      const imageUrl = document.getElementById('imageUrl').value;
      const description = document.getElementById('description').value;
      const category = document.getElementById('category').value;
      const content = CKEDITOR.instances.editor.getData();

      if (!title || !imageUrl || !description || !content) {
        alert('All fields are required!');
        return;
      }

      const post = { title, imageUrl, description, category, content };

      try {
        if (editingPostId) {
          await db.collection('blogs').doc(editingPostId).update(post);
          alert('Blog updated successfully!');
        } else {
          const docRef = await db.collection('blogs').add(post);
          console.log('Blog saved with ID:', docRef.id);
          alert('Blog saved successfully!');
        }
        resetForm();
        loadPosts();
      } catch (error) {
        console.error('Error saving blog:', error);
        alert('Failed to save blog. Check console for details.');
      }
    }

    // Function to load blog posts
    async function loadPosts() {
      try {
        const snapshot = await db.collection('blogs').get();
        const blogList = document.getElementById('blogList');
        blogList.innerHTML = '';

        snapshot.forEach((doc) => {
          const post = doc.data();
          blogList.innerHTML += `
                        <div class="blog-item">
                            <h4>${post.title}</h4>
                            <img src="${post.imageUrl}" style="max-width:100%;">
                            <p><strong>Category:</strong> ${post.category}</p>
                            <p>${post.description}</p>
                            <button onclick="editPost('${doc.id}')">Edit</button>
                            <button onclick="deletePost('${doc.id}')">Delete</button>
                        </div>
                    `;
        });
      } catch (error) {
        console.error('Error loading blogs:', error);
      }
    }

    // Function to delete a blog post
    async function deletePost(id) {
      try {
        await db.collection('blogs').doc(id).delete();
        loadPosts();
      } catch (error) {
        console.error('Error deleting blog:', error);
      }
    }

    // Function to edit a blog post
    async function editPost(id) {
      try {
        const doc = await db.collection('blogs').doc(id).get();
        if (doc.exists) {
          const post = doc.data();
          document.getElementById('title').value = post.title;
          document.getElementById('imageUrl').value = post.imageUrl;
          document.getElementById('description').value = post.description;
          document.getElementById('category').value = post.category;
          CKEDITOR.instances.editor.setData(post.content);

          editingPostId = id;
          document.getElementById('saveButton').textContent = 'Update Post';
        }
      } catch (error) {
        console.error('Error editing blog:', error);
      }
    }

    // Function to reset the form
    function resetForm() {
      document.getElementById('title').value = '';
      document.getElementById('imageUrl').value = '';
      document.getElementById('description').value = '';
      document.getElementById('category').value = 'Technology';
      CKEDITOR.instances.editor.setData('');
      editingPostId = null;
      document.getElementById('saveButton').textContent = 'Save Post';
    }

    // Initialize Firebase when the DOM is fully loaded
    document.addEventListener('DOMContentLoaded', () => {
      // Your Firebase configuration
      const firebaseConfig = {
        apiKey: "AIzaSyBtxzo1ObhEb-gSG00qxeRBg9WHeuLk2rE",
        authDomain: "webpage-d2496.firebaseapp.com",
        projectId: "webpage-d2496",
        storageBucket: "webpage-d2496.firebasestorage.app",
        messagingSenderId: "921444545874",
        appId: "1:921444545874:web:c77134d28bb7294742b68b",
        measurementId: "G-0P5F4JSTHD"
      };

      const app = firebase.initializeApp(firebaseConfig);
      db = firebase.firestore(app);
      loadPosts();
    });

  </script>
