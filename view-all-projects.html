<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Projects | Mr.Sajan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Additional styles for projects page */
        .projects-hero {
            position: relative;
            padding: var(--space-xxl) 0;
            text-align: center;
            overflow: hidden;
        }
        
        .projects-hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.1), rgba(255, 0, 228, 0.1));
            z-index: -1;
        }
        
        .projects-hero h1 {
            font-size: var(--text-xxxl);
            margin-bottom: var(--space-sm);
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .projects-hero p {
            max-width: 700px;
            margin: 0 auto var(--space-xl);
            font-size: var(--text-md);
            color: var(--text);
        }
        
        .projects-filter {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: var(--space-sm);
            margin-bottom: var(--space-xl);
        }
        
        .filter-chip {
            padding: var(--space-xs) var(--space-md);
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--border-radius-xl);
            color: var(--text-dark);
            font-family: var(--font-heading);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: var(--text-xs);
            cursor: pointer;
            transition: all var(--transition-speed) var(--transition-easing);
        }
        
        .filter-chip.active, .filter-chip:hover {
            background-color: var(--primary);
            color: var(--bg-dark);
            border-color: var(--primary);
            box-shadow: var(--shadow-primary);
        }
        
        .projects-grid-extended {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: var(--space-lg);
            margin-bottom: var(--space-xxl);
        }
        
        .project-card-extended {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--border-radius-lg);
            overflow: hidden;
            transition: all var(--transition-speed) var(--transition-easing);
            position: relative;
        }
        
        .project-card-extended:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary);
        }
        
        .project-image-extended {
            height: 200px;
            position: relative;
            overflow: hidden;
            background-size: cover;
            background-position: center;
        }
        
        .project-image-extended::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            opacity: 0;
            transition: opacity var(--transition-speed) var(--transition-easing);
            z-index: 1;
        }
        
        .project-card-extended:hover .project-image-extended::before {
            opacity: 0.2;
        }
        
        .image-overlay-extended {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
            z-index: 1;
        }
        
        .project-badge-extended {
            position: absolute;
            top: var(--space-md);
            right: var(--space-md);
            background-color: var(--primary);
            color: var(--bg-dark);
            padding: var(--space-xxs) var(--space-sm);
            border-radius: var(--border-radius-xl);
            font-size: var(--text-xs);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 2;
        }
        
        .project-content-extended {
            padding: var(--space-lg);
        }
        
        .project-title-extended {
            font-size: var(--text-lg);
            margin-bottom: var(--space-sm);
            color: var(--text-light);
        }
        
        .project-description-extended {
            font-size: var(--text-sm);
            color: var(--text);
            margin-bottom: var(--space-md);
            min-height: 60px;
        }
        
        .project-tech-extended {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-xs);
            margin-bottom: var(--space-md);
        }
        
        .tech-tag-extended {
            background-color: rgba(0, 240, 255, 0.1);
            color: var(--primary);
            padding: var(--space-xxs) var(--space-sm);
            border-radius: var(--border-radius-xl);
            font-size: var(--text-xs);
            font-weight: 500;
        }
        
        .project-links-extended {
            display: flex;
            gap: var(--space-md);
        }
        
        .project-link-extended {
            display: flex;
            align-items: center;
            color: var(--text);
            font-size: var(--text-sm);
            transition: all var(--transition-speed) var(--transition-easing);
        }
        
        .project-link-extended i {
            margin-right: var(--space-xs);
        }
        
        .project-link-extended:hover {
            color: var(--primary);
        }
        
        .load-more {
            text-align: center;
            margin-bottom: var(--space-xxl);
        }
        
        @media (max-width: 768px) {
            .projects-grid-extended {
                grid-template-columns: 1fr;
            }
            
            .projects-hero h1 {
                font-size: var(--text-xxl);
            }
        }
    </style>
</head>
<body>
    <!-- Particle Background Canvas -->
    <canvas id="particleCanvas"></canvas>
    
    <!-- Floating Navigation -->
    <nav class="floating-nav">
        <div class="nav-brand">
            <span class="nav-logo">SK</span>
            <span class="nav-name">Mr.Sajan</span>
        </div>
        <div class="nav-links">
            <a href="index.html#home" class="nav-link">
                <span class="link-icon"><i class="fas fa-home"></i></span>
                <span class="link-text">Home</span>
            </a>
            <a href="index.html#projects" class="nav-link active">
                <span class="link-icon"><i class="fas fa-rocket"></i></span>
                <span class="link-text">Projects</span>
            </a>
            <a href="blogs.html" class="nav-link">
                <span class="link-icon"><i class="fas fa-blog"></i></span>
                <span class="link-text">Blogs</span>
            </a>
            <a href="index.html#contact" class="nav-link">
                <span class="link-icon"><i class="fas fa-satellite-dish"></i></span>
                <span class="link-text">Contact</span>
            </a>
        </div>
        <div class="nav-footer">
            <button class="theme-toggle" aria-label="Toggle theme">
                <i class="fas fa-moon"></i>
                <i class="fas fa-sun"></i>
            </button>
            <div class="social-links">
                <a href="#" class="social-link" aria-label="GitHub"><i class="fab fa-github"></i></a>
                <a href="#" class="social-link" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
                <a href="#" class="social-link" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                <a href="#" class="social-link" aria-label="Medium"><i class="fab fa-medium"></i></a>
                <a href="admin-login.html" class="admin-link">
                    <i class="fas fa-lock"></i>
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="content-wrapper">
        <!-- Projects Hero Section -->
        <section class="projects-hero">
            <div class="container">
                <h1>All Projects</h1>
                <p>Explore my collection of cutting-edge AI and machine learning projects. Each one represents a unique challenge and innovative solution in the field of artificial intelligence.</p>
                
                <div class="projects-filter">
                    <div class="filter-chip active" data-filter="all">All</div>
                    <div class="filter-chip" data-filter="ai">AI Research</div>
                    <div class="filter-chip" data-filter="ml">ML Applications</div>
                    <div class="filter-chip" data-filter="quantum">Quantum AI</div>
                    <div class="filter-chip" data-filter="opensource">Open Source</div>
                </div>
            </div>
        </section>
        
        <!-- Projects Grid -->
        <section class="container">
            <div class="projects-grid-extended" id="projectsContainer">
                <!-- Projects will be loaded dynamically here -->
            </div>
            
            <div class="load-more">
                <button class="btn btn-outline" id="loadMoreProjects">
                    <i class="fas fa-sync-alt"></i>
                    <span>Load More Projects</span>
                </button>
            </div>
        </section>
    </main>

    <script src="scripts.js"></script>
    <!-- Add Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
    
    <script>
        // Firebase configuration (same as in blogs.html)
        const firebaseConfig = {
    apiKey: "AIzaSyCWMMjn8zoqd9FBSLe8GU0kxzuvPtgd26o",
    authDomain: "sajankumar-7fe56.firebaseapp.com",
    projectId: "sajankumar-7fe56",
    storageBucket: "sajankumar-7fe56.firebasestorage.app",
    messagingSenderId: "530497965075",
    appId: "1:530497965075:web:a29f682c663c1d13b283e6",
    measurementId: "G-4HDJ9D9R32"
  };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        document.addEventListener('DOMContentLoaded', function() {
            loadProjects();
            
            // Project filtering functionality
            const filterChips = document.querySelectorAll('.filter-chip');
            
            filterChips.forEach(chip => {
                chip.addEventListener('click', function() {
                    filterChips.forEach(c => c.classList.remove('active'));
                    this.classList.add('active');
                    const filter = this.getAttribute('data-filter');
                    filterProjects(filter);
                });
            });
            
            // Load more projects
            document.getElementById('loadMoreProjects').addEventListener('click', function() {
                this.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Loading...</span>';
                setTimeout(() => {
                    this.innerHTML = '<i class="fas fa-sync-alt"></i><span>No More Projects</span>';
                    this.disabled = true;
                }, 1500);
            });
        });
        
        function loadProjects() {
            const projectsContainer = document.getElementById('projectsContainer');
            projectsContainer.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i></div>';
            
            database.ref('projects').once('value').then((snapshot) => {
                const projectsData = snapshot.val() || {};
                const projects = Object.values(projectsData);
                
                if (projects.length === 0) {
                    projectsContainer.innerHTML = '<p class="no-projects">No projects found. Check back later!</p>';
                    return;
                }
                
                projectsContainer.innerHTML = '';
                
                projects.forEach(project => {
                    if (project.status !== 'active') return;
                    
                    const categoryMap = {
                        'ai': 'AI Research',
                        'ml': 'ML Application',
                        'quantum': 'Quantum AI',
                        'opensource': 'Open Source'
                    };
                    
                    const projectCard = document.createElement('div');
                    projectCard.className = 'project-card-extended';
                    projectCard.setAttribute('data-category', project.category);
                    
                    projectCard.innerHTML = `
                        <div class="project-image-extended" style="background-image: url('${project.image}')">
                            <div class="image-overlay-extended"></div>
                            <div class="project-badge-extended">${categoryMap[project.category] || project.category}</div>
                        </div>
                        <div class="project-content-extended">
                            <h3 class="project-title-extended">${project.title}</h3>
                            <p class="project-description-extended">${project.description}</p>
                            <div class="project-tech-extended">
                                ${project.tech.map(tech => `<span class="tech-tag-extended">${tech}</span>`).join('')}
                            </div>
                            <div class="project-links-extended">
                                ${project.demoUrl ? `<a href="${project.demoUrl}" class="project-link-extended" target="_blank">
                                    <i class="fas fa-external-link-alt"></i>
                                    <span>Live Demo</span>
                                </a>` : ''}
                                ${project.codeUrl ? `<a href="${project.codeUrl}" class="project-link-extended" target="_blank">
                                    <i class="fab fa-github"></i>
                                    <span>Code</span>
                                </a>` : ''}
                            </div>
                        </div>
                    `;
                    
                    projectsContainer.appendChild(projectCard);
                });
            }).catch(error => {
                console.error("Error loading projects:", error);
                projectsContainer.innerHTML = '<p class="error-message">Failed to load projects. Please try again later.</p>';
            });
        }
        
        function filterProjects(filter) {
            const projectCards = document.querySelectorAll('.project-card-extended');
            
            projectCards.forEach(card => {
                const categories = card.getAttribute('data-category').split(' ');
                
                if (filter === 'all' || categories.includes(filter)) {
                    card.style.display = 'block';
                    setTimeout(() => {
                        card.style.opacity = '1';
                        card.style.transform = 'translateY(0)';
                    }, 10);
                } else {
                    card.style.opacity = '0';
                    card.style.transform = 'translateY(20px)';
                    setTimeout(() => {
                        card.style.display = 'none';
                    }, 300);
                }
            });
        }
    </script>
</body>
</html>
